name: MiBici - CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas API
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
          python -m pip install pytest==9.1.1 httpx==0.28.1

      - name: Ejecutar pruebas de API
        run: python -m pytest tests/test_api.py --noconftest -v

  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen con cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: mibici-equipo37-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Validar despliegue y prediccion
    runs-on: ubuntu-latest
    needs: [test, build]
    timeout-minutes: 20

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Validar configuracion Compose
        run: docker compose config --quiet

      - name: Levantar sistema
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          docker compose ps

      - name: Verificar salud y prediccion real
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8000"

          with urllib.request.urlopen(base + "/health", timeout=30) as r:
              assert r.status == 200
              health = json.load(r)
              assert health["status"] == "ok"
              assert health["model_version"]
              print("Healthcheck exitoso:", health)

          payload = {
              "hora": 5,
              "ocup_est": 0.6,
              "estado_est": 0,
              "tend_1h": 0.0,
              "sal_1h": 0.0,
              "sal_2h": 0.0,
              "sal_ayer_2h": 6.0,
              "sal_sem_2h": 0.0,
              "sal_media7_2h": 3.14,
              "lle_1h": 0.0,
              "lle_2h": 0.0,
              "lle_ayer_2h": 1.0,
              "lle_sem_2h": 0.0,
              "lle_media7_2h": 2.14,
              "frac_vacio_7d": 0.4,
              "frac_lleno_7d": 0.4,
              "riesgo_ayer": 0,
              "dia_semana": 5,
              "fin_semana": 1,
              "festivo": 0,
              "C": 15,
              "lat": 20.6664,
              "lon": -103.3488
          }

          request = urllib.request.Request(
              base + "/predict_p2/",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=60) as r:
              assert r.status == 200
              result = json.load(r)
              assert result["prediction"] in (0, 1, 2)
              assert result["message"]
              assert result["model_version"]
              print("Prediccion exitosa:", result)
          PY

      - name: Mostrar diagnostico si falla
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Detener servicios
        if: always()
        run: docker compose down -v --remove-orphans
